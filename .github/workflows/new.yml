name: Java CI/CD Pipeline to Tomcat and S3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, linux]

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Maven if missing
      - name: Ensure Maven is installed
        run: |
          if ! command -v mvn &> /dev/null; then
            echo "Maven not found. Installing..."
            sudo dnf install -y maven
          else
            echo "Maven is already installed"
          fi
          mvn -version

      # 4. Build WAR with Maven
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 5. Verify WAR file
      - name: Verify WAR file
        run: |
          ls -lh target/*.war
          test -n "$(find target -maxdepth 1 -type f -name '*.war' -print -quit)"

      # 6. Upload WAR as GitHub Actions artifact
      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: myapp
          path: target/*.war
          if-no-files-found: error
          retention-days: 7

      # 7. Upload WAR to Amazon S3
      - name: Upload WAR to S3
        env:
          AWS_REGION: ap-south-1
          S3_BUCKET: git-s3-bucket-123
        run: |
          WAR_FILE=$(find target -maxdepth 1 -type f -name '*.war' -print -quit)

          if [ -z "$WAR_FILE" ]; then
            echo "ERROR: No WAR file found"
            exit 1
          fi

          echo "Uploading $WAR_FILE to S3..."

          aws s3 cp "$WAR_FILE" \
            "s3://${S3_BUCKET}/releases/$(basename "$WAR_FILE")" \
            --region "$AWS_REGION"

          echo "S3 upload completed successfully"

  deploy:
    runs-on: [self-hosted, linux]
    needs: build
    environment: production

    steps:
      # 8. Download WAR artifact from GitHub Actions
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: myapp
          path: ./deploy

      # 9. Deploy WAR to Tomcat Manager
      - name: Deploy to Tomcat
        env:
          TOMCAT_USER: ${{ secrets.TOMCAT_USER }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
        run: |
          set -e

          WAR_FILE=$(find ./deploy -maxdepth 1 -type f -name '*.war' -print -quit)

          if [ -z "$WAR_FILE" ]; then
            echo "ERROR: No WAR file found for deployment"
            exit 1
          fi

          echo "Deploying WAR to Tomcat..."

          curl --fail --show-error --silent \
            --user "$TOMCAT_USER:$TOMCAT_PASSWORD" \
            --upload-file "$WAR_FILE" \
            "http://${TOMCAT_HOST}/manager/text/deploy?path=/myapp&update=true"

          echo "Tomcat deployment completed successfully"
